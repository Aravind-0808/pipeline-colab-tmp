[project]
name = "dataforge-pipeline"
version = "0.1.0"
description = "DataForge pipeline — the dataset work (hand tracking, retargeting, dataset builds) for the pipeline server. No database, no model."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.3",
    # The queue: work arrives from the app server's Redis and results go back to it.
    "celery[redis]>=5.4",
    "httpx>=0.27",
    # Storage: the app server's MinIO. Hugging Face only to publish.
    "minio>=7.2",
    # Xet storage: a push sends only the bytes the Hub does not have yet.
    "huggingface_hub>=1.0",
    "hf_xet>=1.1",
    # The AI check: frames (Pillow) and the model's OpenAI-compatible gateway.
    # Capped: the code is written against the 1.x client.
    "pillow>=10.0",
    "openai>=1.0,<2",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# The machine-learning stack: dataset builds and hand tracking. The image
# installs it; the tests stand its calls in and run without it.
#
# opencv: the headless build is what this needs; MediaPipe asks for the
# contrib desktop one, and the Dockerfile collapses the two into one headless
# contrib build. lerobot: [dataset] only — nothing here calls lerobot-annotate.
# MediaPipe reads the hand, scipy solves the IK. All
# CPU: any GPUs on the server serve the model, not this. numpy, PyAV and pandas
# are imported by this code directly, so they are named here rather than left
# to arrive with lerobot.
ml = [
    "opencv-python-headless>=4.9",
    "lerobot[dataset]",
    "mediapipe>=0.10",
    "scipy>=1.11",
    "numpy>=1.26",
    "av>=12",
    "pandas>=2.0",
]
dev = ["pytest>=8", "fakeredis>=2.26", "lupa>=2.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dfpipeline*"]
